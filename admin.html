<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANARA Admin Panel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  padding:24px 20px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:1.5rem;
}

.topbar h1{
  font-size:20px;
  font-weight:600;
  color:#222;
}

.last-updated{
  font-size:12px;
  color:#999;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:12px;
  margin-bottom:1.5rem;
}

.metric{
  background:white;
  border-radius:12px;
  padding:14px 16px;
  border:1px solid #eee;
}

.metric-label{
  font-size:12px;
  color:#888;
  margin-bottom:4px;
}

.metric-val{
  font-size:22px;
  font-weight:600;
  color:#222;
}

.metric-val.green{color:#16a34a;}
.metric-val.amber{color:#d97706;}
.metric-val.red{color:#dc2626;}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:1rem;
}

.controls input,
.controls select{
  padding:9px 12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:14px;
  background:white;
  outline:none;
}

.controls input{flex:1;min-width:180px;}
.controls input:focus,
.controls select:focus{border-color:#16a34a;}

.tbl-wrap{
  overflow-x:auto;
  border-radius:14px;
  border:1px solid #eee;
  background:white;
  box-shadow:0 4px 20px rgba(0,0,0,0.07);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px;
  table-layout:fixed;
}

th,td{
  padding:11px 13px;
  border-bottom:1px solid #f0f0f0;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

thead tr{background:#f9fafb;}

th{
  font-size:12px;
  font-weight:600;
  color:#555;
  cursor:pointer;
  user-select:none;
}

th:hover{color:#16a34a;}

tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#f9fafb;}

.badge{
  display:inline-block;
  padding:3px 10px;
  border-radius:99px;
  font-size:11px;
  font-weight:600;
}

.badge-confirmed{background:#dcfce7;color:#166534;}
.badge-pending{background:#fef3c7;color:#92400e;}
.badge-cancelled{background:#fee2e2;color:#991b1b;}

.row-count{
  font-size:12px;
  color:#aaa;
  margin-top:8px;
  text-align:right;
}

.empty{
  text-align:center;
  padding:2.5rem;
  color:#bbb;
  font-size:14px;
}

@media(max-width:600px){
  .topbar h1{font-size:17px;}
  .metric-val{font-size:18px;}
}
</style>
</head>

<body>

<div class="topbar">
  <h1>VANARA Orders</h1>
  <div class="last-updated" id="lastUpdated">Connecting…</div>
</div>

<div class="metrics">
  <div class="metric">
    <div class="metric-label">Total orders</div>
    <div class="metric-val" id="m-total">—</div>
  </div>
  <div class="metric">
    <div class="metric-label">Confirmed</div>
    <div class="metric-val green" id="m-confirmed">—</div>
  </div>
  <div class="metric">
    <div class="metric-label">Pending</div>
    <div class="metric-val amber" id="m-pending">—</div>
  </div>
  <div class="metric">
    <div class="metric-label">Cancelled</div>
    <div class="metric-val red" id="m-cancelled">—</div>
  </div>
  <div class="metric">
    <div class="metric-label">Total revenue</div>
    <div class="metric-val" id="m-revenue">—</div>
  </div>
</div>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Search by name or phone…">
  <select id="statusFilter">
    <option value="">All statuses</option>
    <option value="Order Confirmed">Confirmed</option>
    <option value="Pending">Pending</option>
    <option value="Cancelled">Cancelled</option>
  </select>
</div>

<div class="tbl-wrap">
  <table>
    <colgroup>
      <col style="width:13%"><col style="width:11%"><col style="width:18%">
      <col style="width:9%"><col style="width:8%"><col style="width:8%">
      <col style="width:8%"><col style="width:5%"><col style="width:10%"><col style="width:10%">
    </colgroup>
    <thead>
      <tr>
        <th data-col="name">Name ↕</th>
        <th>Phone</th>
        <th>Address</th>
        <th>City</th>
        <th>State</th>
        <th>Country</th>
        <th>Pincode</th>
        <th data-col="qty">Qty ↕</th>
        <th data-col="amount">Amount ↕</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="ordersTable">
      <tr><td colspan="10" class="empty">Connecting to Firebase…</td></tr>
    </tbody>
  </table>
</div>

<div class="row-count" id="rowCount"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
  apiKey:"AIzaSyDuYbsb-wF11tPXtoXnExcMVEfNR5A1Bfw",
  authDomain:"vanara-b0bf4.firebaseapp.com",
  projectId:"vanara-b0bf4"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const tbody=document.getElementById('ordersTable');
const searchInput=document.getElementById('searchInput');
const statusFilter=document.getElementById('statusFilter');

let allOrders=[];
let sortCol='';
let sortDir=1;

db.collection("orders").orderBy("createdAt","desc").onSnapshot(snap=>{
  allOrders=snap.docs.map(d=>({id:d.id,...d.data()}));
  updateMetrics(allOrders);
  render();
  document.getElementById('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();
},()=>{
  tbody.innerHTML='<tr><td colspan="10" class="empty">Could not connect to Firebase.</td></tr>';
});

function updateMetrics(data){
  document.getElementById('m-total').textContent=data.length;
  document.getElementById('m-confirmed').textContent=data.filter(o=>o.status==='Order Confirmed').length;
  document.getElementById('m-pending').textContent=data.filter(o=>o.status==='Pending').length;
  document.getElementById('m-cancelled').textContent=data.filter(o=>o.status==='Cancelled').length;
  const rev=data.reduce((s,o)=>s+(Number(o.amount)||0),0);
  document.getElementById('m-revenue').textContent='₹'+rev.toLocaleString('en-IN');
}

function render(){
  const q=searchInput.value.toLowerCase();
  const sf=statusFilter.value;
  let data=allOrders.filter(o=>{
    const mq=!q||(o.name||'').toLowerCase().includes(q)||(o.phone||'').toLowerCase().includes(q);
    const ms=!sf||o.status===sf;
    return mq&&ms;
  });
  if(sortCol){
    data=[...data].sort((a,b)=>{
      let av=a[sortCol],bv=b[sortCol];
      if(sortCol==='amount'||sortCol==='qty'){av=Number(av)||0;bv=Number(bv)||0;}
      else{av=(av||'').toString().toLowerCase();bv=(bv||'').toString().toLowerCase();}
      return av<bv?-sortDir:av>bv?sortDir:0;
    });
  }
  if(!data.length){
    tbody.innerHTML='<tr><td colspan="10" class="empty">No orders found.</td></tr>';
    document.getElementById('rowCount').textContent='';
    return;
  }
  tbody.innerHTML=data.map(o=>{
    const sc=o.status==='Order Confirmed'?'confirmed':o.status==='Pending'?'pending':'cancelled';
    return`<tr>
      <td title="${o.name||''}">${o.name||'—'}</td>
      <td>${o.phone||'—'}</td>
      <td title="${o.address||''}">${o.address||'—'}</td>
      <td>${o.city||'—'}</td>
      <td>${o.state||'—'}</td>
      <td>${o.country||'—'}</td>
      <td>${o.pincode||'—'}</td>
      <td>${o.qty||'—'}</td>
      <td>₹${Number(o.amount||0).toLocaleString('en-IN')}</td>
      <td><span class="badge badge-${sc}">${o.status||'—'}</span></td>
    </tr>`;
  }).join('');
  document.getElementById('rowCount').textContent=`Showing ${data.length} of ${allOrders.length} orders`;
}

searchInput.addEventListener('input',render);
statusFilter.addEventListener('change',render);

document.querySelectorAll('th[data-col]').forEach(th=>{
  th.addEventListener('click',()=>{
    const col=th.dataset.col;
    if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}
    document.querySelectorAll('th[data-col]').forEach(t=>{
      t.textContent=t.dataset.col.charAt(0).toUpperCase()+t.dataset.col.slice(1)+' ↕';
    });
    th.textContent=col.charAt(0).toUpperCase()+col.slice(1)+(sortDir===1?' ↑':' ↓');
    render();
  });
});
</script>

</body>
</html>
